<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFs — Apuntes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/extra.css" />
</head>
<body class="has-bottom-bar md:pb-0">
  <main class="max-w-6xl mx-auto px-5 md:px-8 pt-8 md:pt-10 pb-6">
    <p class="eyebrow mb-4"><span>Archivo</span> · <span id="pdf-subject-label">Material original</span></p>
    <div id="tabs" class="pdf-tabs md:hidden"></div>
    <div class="md:flex md:gap-8">
      <aside id="tabs-desktop" class="hidden md:block md:w-56 shrink-0 pdf-tabs-aside"></aside>
      <section class="flex-1 min-w-0">
        <div class="hidden md:flex justify-between items-center mb-4 pb-4" style="border-bottom:1px solid var(--rule);">
          <div id="page-info" class="meta" style="font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;"></div>
          <div class="flex gap-2 items-center">
            <button id="prev" class="btn-icon touch-target">◀</button>
            <button id="next" class="btn-icon touch-target">▶</button>
            <span style="width:1px;height:24px;background:var(--rule);margin:0 0.4rem;"></span>
            <button id="zoom-out" class="btn-icon touch-target">−</button>
            <button id="zoom-in" class="btn-icon touch-target">+</button>
            <span style="width:1px;height:24px;background:var(--rule);margin:0 0.4rem;"></span>
            <a id="open-original-d" href="#" target="_blank" rel="noopener" class="btn-ghost touch-target" style="padding:0.4rem 0.9rem;font-size:.78rem;">Abrir original ↗</a>
          </div>
        </div>
        <div id="status" class="meta mb-3"></div>
        <div class="flex justify-center"><canvas id="pdf-canvas"></canvas></div>
      </section>
    </div>
  </main>
  <div id="bottom-bar-mobile" class="md:hidden action-bar" style="display:flex;gap:0.5rem;">
    <button id="prev-m" class="btn-icon touch-target flex-1">◀</button>
    <div id="page-info-m" class="flex-1 text-center text-sm self-center meta"></div>
    <button id="next-m" class="btn-icon touch-target flex-1">▶</button>
    <button id="zoom-out-m" class="btn-icon touch-target">−</button>
    <button id="zoom-in-m" class="btn-icon touch-target">+</button>
    <a id="open-original-m" href="#" target="_blank" rel="noopener" class="meta self-center text-sm" style="color:var(--accent);text-decoration:underline;">Abrir</a>
  </div>
  <script type="module" src="js/pdfs.js"></script>
</body>
</html>
